# Application settings
spring.application.name=backend
python.api.url=${AI_ENGINE_URL:http://localhost:8000}

# H2 Console Settings (Web interface for the database)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Database Connection Settings (Persistent H2 file)
spring.datasource.url=jdbc:h2:file:./data/transitdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Settings (Automatic schema updates and SQL logging)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Cache Settings (Caffeine)
# expiresAfterWrite=30s ensures that AI predictions are fresh but avoids overloading the engine
spring.cache.cache-names=predictions,nextBuses
spring.cache.caffeine.spec=expireAfterWrite=30s

# Actuator Settings (Health Monitoring)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.defaults.enabled=true
management.endpoints.web.cors.allowed-origins=http://127.0.0.1:5500,http://localhost:5500
management.endpoints.web.cors.allowed-methods=GET,OPTIONS
management.endpoints.web.cors.allowed-headers=*

transit.data.directory=

